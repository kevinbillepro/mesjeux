<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion – Mes Jeux</title>
<style>
  :root {
    --bg: #14161f;
    --panel: #1c1f2c;
    --border: #2b2f40;
    --text: #eef1f7;
    --muted: #8b93a8;
    --accent: #e8b04b;
    --accent-dark: #c9932f;
    --error: #ef8080;
    --success: #7fd8ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
  }
  .brand {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin: 0 0 4px;
  }
  .brand span { color: var(--accent); }
  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #10121a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  button {
    flex: 1;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid transparent;
    font-size: 14px;
    cursor: pointer;
  }
  #login-btn {
    background: var(--accent);
    color: #14161f;
    font-weight: 600;
  }
  #login-btn:hover { background: var(--accent-dark); }
  #signup-btn {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }
  #signup-btn:hover { border-color: var(--accent); }
  #message {
    min-height: 20px;
    font-size: 13px;
    margin-top: 16px;
  }
  #account-section p { color: var(--muted); font-size: 14px; }
  #account-section strong { color: var(--text); }
  #logout-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 8px;
  }
  #logout-btn:hover { border-color: var(--error); color: var(--error); }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">Mes<span>Jeux</span></p>
    <p class="tagline">Connecte-toi pour accéder aux jeux</p>

    <div id="auth-section">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="toi@exemple.com">

      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="········">

      <div class="buttons">
        <button id="signup-btn" type="button">Créer un compte</button>
        <button id="login-btn" type="button">Se connecter</button>
      </div>

      <p id="message"></p>
    </div>

    <div id="account-section" style="display:none;">
      <p>Connecté en tant que <strong id="user-email"></strong></p>
      <button id="logout-btn" type="button">Se déconnecter</button>
    </div>
  </div>

  <!-- Le client Supabase est chargé depuis un CDN : rien à installer. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 1) Colle ici l'URL et la clé de ton projet Supabase (étape "Récupérer les clés").
    //    La clé va dans le code de la page : c'est normal et sans danger, c'est la clé
    //    publique, faite pour ça (elle n'autorise que ce que tu permets explicitement
    //    côté Supabase).
    const SUPABASE_URL = "https://rmjinftbjroqxeylyapn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OyUvUjtcPf6wqdhi6XB1OQ_fMo0bgng";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const authSection = document.getElementById("auth-section");
    const accountSection = document.getElementById("account-section");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const messageEl = document.getElementById("message");
    const userEmailEl = document.getElementById("user-email");

    function showMessage(text, isError) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? "var(--error)" : "var(--success)";
    }

    // Evite d'envoyer une requête à Supabase avec des champs vides : sans ça,
    // Supabase répond avec le message trompeur "Anonymous sign-ins are disabled".
    function credentialsAreFilled() {
      if (!emailInput.value || !passwordInput.value) {
        showMessage("Merci de remplir l'email et le mot de passe.", true);
        return false;
      }
      return true;
    }

    document.getElementById("signup-btn").addEventListener("click", async () => {
      if (!credentialsAreFilled()) return;
      const { error } = await db.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value,
      });
      if (error) {
        showMessage(error.message, true);
      } else {
        showMessage("Compte créé. Si la confirmation par email est activée, vérifie ta boîte mail avant de te connecter.");
      }
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      if (!credentialsAreFilled()) return;
      const { error } = await db.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value,
      });
      if (error) showMessage(error.message, true);
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await db.auth.signOut();
    });

    // Met à jour l'affichage à la connexion, à la déconnexion, et au chargement de la page.
    db.auth.onAuthStateChange((_event, session) => {
      if (session) {
        authSection.style.display = "none";
        accountSection.style.display = "block";
        userEmailEl.textContent = session.user.email;
      } else {
        authSection.style.display = "block";
        accountSection.style.display = "none";
      }
    });
  </script>
</body>
</html>
